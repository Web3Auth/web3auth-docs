name: Check External links

on:
  push:
    branches:
      - master
  pull_request:
    types: [labeled]

jobs:
  markdown-link-check:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'check-links') }}
    runs-on: ubuntu-latest
    steps:
      - name: Wiz sensor
        uses: Web3Auth/.github/.github/actions/wiz-sensor@2f62f5725c0aa2bbdf6ad947dbe589d44665f58c # feat/wiz-sensor-action
        with:
          enabled: ${{ vars.WIZ_SENSOR_ENABLED }}
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          file-extension: .mdx
          use-quiet-mode: yes
